# Kurvenjagd auf dem eigenen Hetzner-Server: Website unter /, Daten (Straßenpakete, Karte) unter /daten/.
# Einrichtung: server/README.md. HTTPS ergänzt danach certbot (--nginx) automatisch in dieser Datei.

# IP-Adressen nur gekürzt protokollieren (IPv4 ohne letzten Block, IPv6 nur die ersten 48 Bit):
# reicht, um aktive Geräte pro Tag grob zu zählen, ohne einzelne Nutzer zu erkennen.
map $remote_addr $kurvenjagd_ip {
    ~^(?<v4>\d+\.\d+\.\d+)\.\d+$       $v4.0;
    ~^(?<v6>[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*):  $v6::;
    default                            0.0.0.0;
}
log_format kurvenjagd_anon '$kurvenjagd_ip [$time_local] "$request" $status $body_bytes_sent';

server {
    listen 80;
    listen [::]:80;
    server_name kurvenjagd.oli-tech.eu;

    access_log off;   # keine Zugriffsprotokolle mit IP-Adressen (Ausnahme: manifest.json gekürzt, siehe unten)

    # Website (Start, Datenschutz, Impressum) – kommt per rsync aus site/
    location / {
        root /srv/kurvenjagd/site;
        try_files $uri $uri/ =404;
    }

    # Daten für die App: öffentlich, für alle Herkünfte freigegeben (Android: https://localhost,
    # iOS: capacitor://localhost, Web-App). Teilanfragen (Range) kann nginx von sich aus – nötig für map.pmtiles.
    location /daten/ {
        root /srv/kurvenjagd;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Headers "Range" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, ETag" always;
        if ($request_method = OPTIONS) { return 204; }
        expires 1d;

        # Eine Abfrage pro App-Start (höchstens alle 6 h): gekürzt protokolliert = grobe Zahl aktiver Geräte
        location ~ ^/daten/v\d+/manifest\.json$ {
            access_log /var/log/nginx/kurvenjagd-manifest.log kurvenjagd_anon;
            expires 1h;
        }
    }
}
