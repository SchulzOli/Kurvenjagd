# Lädt die Website (Ordner site/: Start, Datenschutz, Impressum) auf den eigenen Server:
# https://kurvenjagd.oli-tech.eu/ (Einrichtung und Secrets: server/README.md)
name: Website

on:
  push:
    branches: [main]
    paths: ['site/**']
  workflow_dispatch:

jobs:
  hochladen:
    if: vars.SERVER_AKTIV == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hochladen (rsync)
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
          ZIEL: ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/kurvenjagd && chmod 600 ~/.ssh/kurvenjagd
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          rsync -a --delete -e "ssh -i $HOME/.ssh/kurvenjagd -o BatchMode=yes" site/ "$ZIEL:site/"
