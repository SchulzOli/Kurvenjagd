# Veröffentlicht die Website (Ordner site/: Start, Datenschutz, Impressum) auf GitHub Pages.
# Einmalig: Settings → Pages → Source: „GitHub Actions“. Adresse: https://schulzoli.github.io/Kurvenjagd/
# (später eigene Domain: Settings → Pages → Custom domain, dann KJ_SITE_URL beim Bauen der App setzen)
name: Website

on:
  push:
    branches: [main]
    paths: ['site/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
